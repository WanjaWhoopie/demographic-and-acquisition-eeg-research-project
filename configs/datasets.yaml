# One entry per cohort. Values marked "verify" come from the proposal/slides and must be
# confirmed during the data audit (WORKPLAN Phase 2) before they are relied on.
# Record the exact version / download date of every dataset in `version`.

ds004504:
  source: OpenNeuro
  accession: ds004504
  url: https://openneuro.org/datasets/ds004504
  version: "1.0.9"             # doi:10.18112/openneuro.ds004504.v1.0.9; licence CC0
  descriptor: "Miltiadous et al. (2023), Data 8(6):95, doi:10.3390/data8060095"
  format: BIDS / EEGLAB .set
  reference: A1-A2 (linked ears)
  size_used_gb: 2.16           # AD + HC raw only; scripts/download_ds004504.py
  groups_used: {A: AD, C: HC}  # F (FTD) excluded from primary analysis
  n_expected: {AD: 36, HC: 29, FTD: 23}
  channels_expected: 19
  sfreq_expected: 500
  condition: eyes_closed
  demographics: [age, sex, mmse]
  raw_path: data/raw/ds004504

ADFSU:
  source: "Florida State University database (Dr Dennis Duke); named ADFSU in LEAD via Vicchietti et al. 2023"
  url: https://osf.io/2v5md    # EEG_data.zip (6.6 MB), Vicchietti et al. 2023; NOT osf.io/jbysn
  version: null
  n_expected: {AD: 80, HC: 12}  # verify
  channels_expected: 19
  sfreq_expected: 128
  condition: [eyes_open, eyes_closed]   # verify labels exist per trial
  trial_length_s: 8            # verify
  note: "Band-limited 0.5-30 Hz and artefact-cleaned at source; same origin as ADSZ."
  demographics: []
  raw_path: data/raw/ADFSU

ADSZ:
  source: "figshare 19091771 (Pineda & Alves), CC0; AD data from the FSU / Dennis Duke database"
  url: https://doi.org/10.6084/m9.figshare.19091771.v1
  version: null
  n_expected: {AD: 24, HC: 24}  # files, not people: files suggest 3 AD + 12 HC people, each eyes open + closed
  channels_expected: 19
  sfreq_expected: 128
  condition: [eyes_open, eyes_closed]   # verify
  trial_length_s: 8            # verify
  note: "Same source database as ADFSU; possible EO/EC double counting (T2.3.4, T3)."
  demographics: []
  raw_path: data/raw/ADSZ

APAVA:
  source: "Escudero et al. 2006 (Valladolid); team copy on Google Drive (APAVA.zip, sign-in needed)"
  url: https://drive.google.com/file/d/1FKvUnB8qEcHng7J9CfHaU7gqRLGeS7Ea/view
  alt_url: https://osf.io/jbysn   # AD_Data.tar.gz, described as Escudero et al. 2006 data
  version: null
  n_expected: {AD: 12, HC: 11}  # verify
  channels_expected: 16        # 10-20 without Fz, Cz, Pz (verify)
  sfreq_expected: 256
  condition: eyes_closed
  trial_length_s: 5            # confirmed; APAVA.zip stores 1-s windows with 50% overlap - rebuild trials
  labels: "Label/label.npy: column 0 = 1 AD / 0 HC, column 1 = participant 1-23"
  demographics: []
  raw_path: data/raw/APAVA

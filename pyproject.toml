[project]
name = "eegconf"
version = "0.1.0"
description = "Demographic and acquisition-related information in frozen EEG foundation-model representations for cross-cohort Alzheimer's disease classification"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

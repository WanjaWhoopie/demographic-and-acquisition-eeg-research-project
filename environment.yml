name: eegconf
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - statsmodels
  - matplotlib
  - pyyaml
  - jupyterlab
  - pytest
  - pip:
      # PyTorch with CUDA 13 for the local GPU (RTX 2050); the CPU build also works, just slower
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1
      - mne>=1.7
      - mne-bids
      - openneuro-py
      - specparam          # aperiodic (1/f) fitting, successor of FOOOF
      - concept-erasure    # LEACE (Belrose et al., 2023)
      - einops
      - timm==0.4.12       # version pinned by the LaBraM codebase; confirm in T5.1.2
      - -e .

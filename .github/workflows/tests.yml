# Runs the leakage and audit unit tests on every push and pull request (WORKPLAN T0.4.4).
# The tests use synthetic arrays and never need MNE or the data. CPU-only PyTorch and
# concept-erasure are installed so the LEACE control (Phase 8) is tested too.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scipy pandas scikit-learn pytest concept-erasure -e .
      - run: pytest -q
